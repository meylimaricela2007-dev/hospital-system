# Conexión a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/nombre_de_tu_bd
spring.datasource.username=postgres
spring.datasource.password=tu_contraseña_aqui
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=his

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# precio fijo de la consulta y minutos que dura
# la reserva temporal de un horario mientras el paciente paga.
app.citas.monto-consulta=150.00
app.citas.minutos-reserva=5

# cuántas horas antes de la cita se envía el recordatorio automático del seguimiento.
app.seguimiento.horas-recordatorio=24

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tu_correo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:tu_contraseña_de_aplicacion}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.correo.remitente=${MAIL_USERNAME:tu_correo@gmail.com}
