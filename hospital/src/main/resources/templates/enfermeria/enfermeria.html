<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="hh-shell flex-grow-1">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="flex-grow-1 hh-section-tight">
    <div class="container">

        <div class="mb-4">
            <span class="hh-eyebrow-section">Panel interno · CU-07</span>
            <h1 class="hh-section-title mb-0">Toma de Signos Vitales</h1>
        </div>

        <div id="alertaGeneral" class="alert alert-success d-none"></div>

        <div class="row g-4">
            <!-- ==================================================== -->
            <!-- Columna: "Paciente Presente" (esperando ser llamados)  -->
            <!-- ==================================================== -->
            <div class="col-lg-6">
                <h2 class="h5 d-flex align-items-center gap-2 mb-3">
                    <i class="fas fa-chair"></i>Esperando
                    <span class="badge badge-soft-warning" id="contadorEspera">0</span>
                </h2>
                <div id="listaEspera"></div>
            </div>

            <!-- ==================================================== -->
            <!-- Columna: "Signos Vitales" (ya llamados, en proceso)    -->
            <!-- ==================================================== -->
            <div class="col-lg-6">
                <h2 class="h5 d-flex align-items-center gap-2 mb-3">
                    <i class="fas fa-stethoscope"></i>En proceso
                    <span class="badge badge-soft-info" id="contadorProceso">0</span>
                </h2>
                <div id="listaProceso"></div>
            </div>
        </div>

    </div>
</main>
</div>

<!-- ============================================================ -->
<!-- MODAL: Registrar Signos Vitales (pasos 2-9 del flujo normal)  -->
<!-- ============================================================ -->
<div class="modal fade" id="modalSignos" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
            <div class="modal-header border-0" style="background: var(--color-primary-900); color: #fff;">
                <div>
                    <h5 class="modal-title fw-bold mb-0">Registrar Signos Vitales</h5>
                    <div class="small opacity-75">
                        Paciente: <strong id="signosNombrePaciente"></strong> · No. Cita <span id="signosNoCita"></span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="signosAlertaError" class="alert alert-danger d-none"></div>

                <!-- FA03: alertas clínicas en tiempo real (VitalSignAlertsDisplay) -->
                <div id="signosAlertasClinicas"></div>

                <form id="formSignos" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">Presión sistólica (mmHg)</label>
                            <input type="number" class="form-control text-mono" id="presionSistolica" min="60" max="250" placeholder="120">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Presión diastólica (mmHg)</label>
                            <input type="number" class="form-control text-mono" id="presionDiastolica" min="40" max="150" placeholder="80">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Temperatura (°C)</label>
                            <input type="number" step="0.1" class="form-control text-mono" id="temperatura" min="34" max="42" placeholder="36.5">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Frecuencia cardíaca (lpm)</label>
                            <input type="number" class="form-control text-mono" id="frecuenciaCardiaca" min="30" max="220" placeholder="75">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Peso (kg)</label>
                            <input type="number" step="0.1" class="form-control text-mono" id="peso" min="0.5" max="300" placeholder="70">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Talla (cm)</label>
                            <input type="number" step="0.1" class="form-control text-mono" id="talla" min="30" max="250" placeholder="165">
                        </div>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" role="switch" id="esEmergenciaSignos">
                        <label class="form-check-label fw-semibold" for="esEmergenciaSignos">¿Es Emergencia?</label>
                    </div>
                    <p class="text-muted small">
                        Si se activa, al registrar el paciente pasa directamente a consulta médica sin volver a la sala de espera (FA01).
                    </p>
                </form>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-accent" id="btnRegistrarSignos">
                    <span id="btnRegistrarSignosTexto"><i class="fas fa-notes-medical me-2"></i>Registrar Signos Vitales</span>
                    <span id="btnRegistrarSignosSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/signos-vitales.js}"></script>

</body>
</html>
