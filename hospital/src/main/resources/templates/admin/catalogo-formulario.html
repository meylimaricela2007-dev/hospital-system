<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="hh-shell flex-grow-1">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="flex-grow-1 hh-section-tight">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7">

                <input type="hidden" id="claveCatalogo" th:value="${clave}">
                <input type="hidden" id="idRegistro" th:value="${idRegistro}">

                <a href="#" id="enlaceVolver" class="text-muted small text-decoration-none d-inline-block mb-3">
                    <i class="fas fa-arrow-left me-1"></i> Volver al listado
                </a>

                <div class="hh-card">
                    <span class="hh-eyebrow-section">Panel interno · CU-14</span>
                    <h1 class="hh-section-title" id="tituloFormulario">Catálogo</h1>

                    <div id="alertaExito" class="alert alert-success d-none"></div>
                    <div id="alertaError" class="alert alert-danger d-none"></div>

                    <form id="formCatalogo" novalidate>
                        <div id="contenedorCampos"></div>

                        <div class="d-flex gap-2 justify-content-end mt-4">
                            <a href="#" id="btnCancelar" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-accent" id="btnGuardar">
                                <i class="fas fa-check me-2"></i><span id="textoGuardar">Crear</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/catalogo-formulario.js}"></script>

</body>
</html>
