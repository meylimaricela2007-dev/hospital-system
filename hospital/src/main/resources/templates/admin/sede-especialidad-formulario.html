<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="hh-shell flex-grow-1">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="flex-grow-1 hh-section-tight">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">

                <a href="/admin/sede-especialidad" class="text-muted small text-decoration-none d-inline-block mb-3">
                    <i class="fas fa-arrow-left me-1"></i> Volver al listado
                </a>

                <div class="hh-card">
                    <span class="hh-eyebrow-section">Panel interno · CU-13</span>
                    <h1 class="hh-section-title">Asignar Especialidad a una Sede</h1>
                    <p class="hh-section-desc mb-4">
                        Esta configuración determina las especialidades que verá el paciente al agendar su cita.
                    </p>

                    <div id="alertaExito" class="alert alert-success d-none"></div>
                    <div id="alertaError" class="alert alert-danger d-none"></div>

                    <form id="formAsignacion" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Sede *</label>
                            <select class="form-select" id="idSucursal">
                                <option value="">-- Seleccione una sede --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Especialidad *</label>
                            <select class="form-select" id="idEspecialidad">
                                <option value="">-- Seleccione una especialidad --</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <span class="badge badge-soft-success">Estado: Activo</span>
                            <span class="text-muted small ms-2">Se asigna automáticamente.</span>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a href="/admin/sede-especialidad" class="btn btn-outline-teal">Cancelar</a>
                            <button type="submit" class="btn btn-accent" id="btnAsignar">
                                <i class="fas fa-check me-2"></i>Asignar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/sede-especialidad-formulario.js}"></script>

</body>
</html>
