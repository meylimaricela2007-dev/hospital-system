<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head}"></head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="hh-shell flex-grow-1">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<main class="flex-grow-1 hh-section-tight">
    <div class="container">

        <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
            <div>
                <span class="hh-eyebrow-section">Panel interno</span>
                <h1 class="hh-section-title mb-0">Recepción y Verificación de Cita</h1>
            </div>
            <!-- FA01: paciente llega por emergencia -->
            <button type="button" class="btn btn-lg" style="background: var(--color-danger); color: #fff;"
                    data-bs-toggle="modal" data-bs-target="#modalEmergencia">
                <i class="fas fa-truck-medical me-2"></i>Registrar Emergencia
            </button>
        </div>

        <!-- ==================================================== -->
        <!-- Aviso tras crear un walk-in desde el wizard de citas   -->
        <!-- (CU-05 FA04 -> CU-03; ver citas.js)                    -->
        <!-- ==================================================== -->
        <div id="alertaWalkinCreado" class="alert alert-success d-none"></div>

        <!-- ==================================================== -->
        <!-- Barra de búsqueda (paso 2-3 del flujo normal, FA02)    -->
        <!-- ==================================================== -->
        <div class="hh-card mb-4">
            <label class="form-label">Buscar por</label>
            <div class="btn-group mb-3" role="group" aria-label="Tipo de búsqueda">
                <input type="radio" class="btn-check" name="tipoBusqueda" id="tipoDpi" value="DPI" checked>
                <label class="btn btn-outline-teal" for="tipoDpi"><i class="fas fa-id-card me-1"></i> Por DPI</label>

                <input type="radio" class="btn-check" name="tipoBusqueda" id="tipoCita" value="CITA">
                <label class="btn btn-outline-teal" for="tipoCita"><i class="fas fa-hashtag me-1"></i> Por No. Cita</label>
            </div>
            <div class="row g-2 align-items-end">
                <div class="col-md-8">
                    <input type="text" id="inputBusqueda" class="form-control form-control-lg text-mono"
                           placeholder="Ingrese el DPI del paciente (13 dígitos)" maxlength="13" autocomplete="off">
                </div>
                <div class="col-md-4">
                    <button class="btn btn-accent btn-lg w-100" id="btnBuscar">
                        <span id="btnBuscarTexto"><i class="fas fa-magnifying-glass me-2"></i>Buscar</span>
                        <span id="btnBuscarSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================================================== -->
        <!-- Resultado de la búsqueda                               -->
        <!-- ==================================================== -->
        <div id="resultadoBusqueda"></div>

    </div>
</main>
</div>

<!-- ============================================================ -->
<!-- MODAL: Registrar Emergencia (FA01)                             -->
<!-- ============================================================ -->
<div class="modal fade" id="modalEmergencia" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
            <div class="modal-header border-0" style="background: var(--color-danger); color: #fff;">
                <h5 class="modal-title fw-bold"><i class="fas fa-truck-medical me-2"></i>Registrar Emergencia</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="alertaEmergencia" class="alert alert-danger d-none"></div>
                <a id="btnRegistrarPacienteEmergencia" href="/registro" target="_blank" rel="noopener"
                   class="btn btn-teal w-100 mb-3 d-none">
                    <i class="fas fa-user-plus me-2"></i>Registrar paciente
                </a>

                <label class="form-label">DPI del paciente</label>
                <input type="text" id="emergenciaDpi" class="form-control text-mono mb-3" maxlength="13" placeholder="0000000000000">

                <label class="form-label">Sede</label>
                <select id="emergenciaSucursal" class="form-select mb-3"><option value="">Cargando...</option></select>

                <label class="form-label">Especialidad</label>
                <select id="emergenciaEspecialidad" class="form-select mb-3" disabled><option value="">Seleccione una sede primero</option></select>

                <label class="form-label">Motivo (opcional)</label>
                <textarea id="emergenciaMotivo" class="form-control" rows="2" placeholder="Ej. Dificultad respiratoria..."></textarea>
                <div class="form-check mt-3">
                    <input class="form-check-input" type="checkbox" id="emergenciaTriaje">
                    <label class="form-check-label" for="emergenciaTriaje">
                        El paciente fue clasificado como <strong>EMERGENCIA</strong> según triaje
                    </label>
                </div>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn" style="background: var(--color-danger); color:#fff;" id="btnConfirmarEmergencia">
                    <i class="fas fa-truck-medical me-2"></i>Registrar EMERGENCIA
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: Reasignar Médico (FA07)                                 -->
<!-- ============================================================ -->
<div class="modal fade" id="modalReasignar" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0" style="border-radius: var(--radius-lg); overflow: hidden;">
            <div class="modal-header border-0" style="background: var(--color-primary-900); color: #fff;">
                <h5 class="modal-title fw-bold"><i class="fas fa-user-doctor me-2"></i>Reasignar Médico</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="alertaReasignar" class="alert alert-danger d-none"></div>
                <div id="resumenReasignacion" class="mb-3"></div>
                <label class="form-label">Nuevo médico</label>
                <div id="listaMedicosReasignar" class="mb-3"></div>
                <label class="form-label">Nota (opcional)</label>
                <textarea id="reasignarNota" class="form-control" rows="2" placeholder="Motivo de la reasignación..."></textarea>
            </div>
            <div class="modal-footer border-0 justify-content-center pb-4">
                <button type="button" class="btn btn-link text-muted text-decoration-none" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-teal" id="btnConfirmarReasignar" disabled>
                    <i class="fas fa-check me-2"></i>Confirmar Reasignación
                </button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/recepcion.js}"></script>

</body>
</html>
